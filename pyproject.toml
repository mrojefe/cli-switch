[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-switch"
version = "0.1.0"
description = "Bascule entre plusieurs comptes Claude Code et Antigravity (AGY) sur une même machine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "psutil>=6.0",
    "filelock>=3.15",
]

[project.scripts]
cli-switch = "cli_switch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_switch"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
